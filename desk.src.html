<title>Discount Desk</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns=%27http://www.w3.org/2000/svg%27 viewBox=%270 0 32 32%27%3E%3Crect width=%2732%27 height=%2732%27 rx=%276%27 fill=%27%23f5c400%27/%3E%3Ctext x=%2716%27 y=%2721.5%27 font-size=%2713%27 font-family=%27Arial,sans-serif%27 font-weight=%27700%27 text-anchor=%27middle%27 fill=%27%23191918%27%3EDD%3C/text%3E%3C/svg%3E">
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wght@500;600;700;800&family=IBM+Plex+Mono:wght@400;500;600&family=IBM+Plex+Sans:ital,wght@0,400;0,500;0,600;1,400&display=swap">
<style>
/* Layout: an analyst's case file. Sticky case bar with progress, one working column per step, figures in ruled ledgers; ink for observed data, blue for forecasts, hatching for what-if assumptions, yellow as the highlighter. */
:root{
  --paper:#f5f6f4; --sheet:#ffffff; --ink:#1b1f1d; --muted:#59605c; --line:#dde2df; --grid:transparent;
  --desk:#00543a; --desk-ink:#ffffff; --desk-soft:#eef1ee; --gold:#6f6527; --gold-soft:#e8e1b0;
  --brand:#006747; --brand-ink:#ffffff; --brand-soft:#cfe5da;
  --fc:#2d5c8c; --fc-soft:#dde7f2;
  --gain:#1b7643; --loss:#b3342a; --neutral:#e5e4dd; --warn:#955a00; --warn-soft:#fbedd3; --loss-soft:#f6dfdb; --gain-soft:#dcefe1;
  --display:"Archivo",ui-sans-serif,system-ui,sans-serif;
  --body:"IBM Plex Sans",ui-sans-serif,system-ui,sans-serif;
  --mono:"IBM Plex Mono",ui-monospace,Menlo,monospace;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --paper:#121211; --sheet:#1a1a18; --ink:#ecebe5; --muted:#a3a198; --line:#2f2e2a; --grid:transparent;
  --desk:#2f9e6f; --desk-ink:#ffffff; --desk-soft:#1d2a24; --gold:#cfc493; --gold-soft:#4a4520;
  --brand:#2f9e6f; --brand-ink:#ffffff; --brand-soft:#173a2b;
  --fc:#8fb6e0; --fc-soft:#1b2836;
  --gain:#62c98a; --loss:#ef7d70; --neutral:#2a2925; --warn:#f0b05a; --warn-soft:#3a2b12; --loss-soft:#3b1e1a; --gain-soft:#163222; color-scheme:dark}}
:root[data-theme="dark"]{
  --paper:#121211; --sheet:#1a1a18; --ink:#ecebe5; --muted:#a3a198; --line:#2f2e2a; --grid:transparent;
  --desk:#2f9e6f; --desk-ink:#ffffff; --desk-soft:#1d2a24; --gold:#cfc493; --gold-soft:#4a4520;
  --brand:#2f9e6f; --brand-ink:#ffffff; --brand-soft:#173a2b;
  --fc:#8fb6e0; --fc-soft:#1b2836;
  --gain:#62c98a; --loss:#ef7d70; --neutral:#2a2925; --warn:#f0b05a; --warn-soft:#3a2b12; --loss-soft:#3b1e1a; --gain-soft:#163222; color-scheme:dark}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--paper);color:var(--ink);font:16px/1.6 var(--body);font-variant-numeric:tabular-nums}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:30;background:var(--paper)}
h1,h2,h3{font-family:var(--display);margin:0;line-height:1.15;text-wrap:balance;font-weight:700}
h2{font-size:clamp(26px,3.4vw,34px);letter-spacing:-.015em;font-weight:800}
h3{font-size:17px;font-weight:600}
p{margin:0}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--gold);outline-offset:2px}
.muted{color:var(--muted)}
.small{font-size:14px}
.hl{background:linear-gradient(transparent 56%,var(--gold-soft) 56%);padding:0 2px}
.ok{color:var(--gain)} .bad{color:var(--loss)} .warn{color:var(--warn)}
.hidden{display:none!important}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.eyebrow{font:600 14px/1.3 var(--body);color:var(--muted)}

/* case bar */
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:color-mix(in srgb,var(--paper) 94%,transparent);backdrop-filter:blur(6px);border-bottom:1px solid var(--line)}
.top .in,.toc,.prog{max-width:1080px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.top .in{padding-block:10px 4px;display:flex;align-items:baseline;gap:12px;flex-wrap:wrap}
.top .t{font:800 17px/1.2 var(--display);letter-spacing:-.01em}
.top .who{color:var(--muted);font-size:14px}
.top .grow{flex:1}
.top .count{font:500 13px/1.2 var(--body);color:var(--muted)}
.top.emb .t,.top.emb .who{display:none}
.prog{display:flex;align-items:center;gap:14px;padding-block:6px 4px;flex-wrap:wrap}
.pbar{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:3px;width:min(260px,100%)}
.pbar i{height:5px;background:var(--neutral);border-radius:1px;transition:background-color .3s}
.pbar i.on{background:var(--ink)}
.pbar i.cur{background:var(--gold-soft);box-shadow:inset 0 0 0 1px var(--gold)}
.nexttxt{font-size:13px;color:var(--muted);min-width:0;flex:1 1 220px}
@media (max-width:700px){.top{position:static}.pbar{width:100%}.toc{gap:2px 12px}}
.nexttxt b{color:var(--ink);font-weight:600}
.toc{display:flex;gap:2px 18px;flex-wrap:wrap;padding-block:2px 8px;font-size:14px}
.toc button{background:none;border:0;padding:4px 0;cursor:pointer;color:var(--muted);border-bottom:2px solid transparent}
.toc button[aria-current="step"]{color:var(--ink);border-bottom-color:var(--gold);font-weight:600}
.toc button.done{color:var(--ink)}
.toc button.done::after{content:" ✓";color:var(--gain)}
.toc button.locked{color:color-mix(in srgb,var(--muted) 60%,transparent)}
.toc button.locked::before{content:"";display:inline-block;width:8px;height:9px;margin-right:5px;border:1.5px solid currentColor;border-radius:1px;vertical-align:-1px;opacity:.7}

/* page */
.shell{max-width:1080px;margin:0 auto;padding-block:32px 96px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.step{display:flex;flex-direction:column;gap:28px;animation:rise .35s ease both}
@keyframes rise{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
.head{display:flex;flex-direction:column;gap:10px;max-width:760px}
.head h2:focus{outline:none}
.head .lead{color:var(--muted);font-size:17px;max-width:66ch}
.casecard{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));border-top:2px solid var(--ink);border-bottom:1px solid var(--line)}
.casecard div{padding:12px 16px 14px 0;display:flex;flex-direction:column;gap:4px;font-size:14px;min-width:0}
.casecard div+div{padding-left:16px;border-left:1px solid var(--line)}
.casecard b{font:600 13px/1.2 var(--body);color:var(--muted)}
.casecard div:first-child span{font:600 16px/1.35 var(--display)}
@media (max-width:820px){.casecard{grid-template-columns:1fr 1fr}.casecard div:nth-child(3){padding-left:0;border-left:0}.casecard div:nth-child(n+3){border-top:1px solid var(--line)}}
@media (max-width:480px){.casecard div:nth-child(2),.casecard div:nth-child(3){display:none}.casecard{grid-template-columns:1fr}.casecard div+div{padding-left:0;border-left:0;border-top:1px solid var(--line)}}
.part{display:flex;flex-direction:column;gap:12px;max-width:760px}
.part.wide{max-width:none}
.part>h3{display:flex;align-items:baseline;gap:10px}
.part>h3 .tag{font:500 13px/1 var(--body);color:var(--muted)}
.lock{border:1px solid var(--line);border-left:4px solid var(--gold);background:var(--sheet);padding:14px 16px;display:flex;flex-direction:column;gap:8px;max-width:760px}
.tourbar{background:var(--ink);color:var(--paper);padding:16px 18px;display:grid;grid-template-columns:minmax(0,1fr) auto;gap:10px 20px;align-items:center;border-radius:3px}
.tourbar .k{font:600 13px/1.2 var(--body);color:var(--gold-soft)}
.tourbar h3{font-size:19px;margin:4px 0 2px}
.tourbar p{font-size:15px;opacity:.85;max-width:66ch}
.tourbar .acts{display:flex;gap:8px;flex-wrap:wrap;justify-content:flex-end}
.tourbar .acts button{background:transparent;color:var(--paper);border:1px solid color-mix(in srgb,var(--paper) 40%,transparent);border-radius:3px;padding:8px 12px;cursor:pointer}
.tourbar .acts button.pri{background:var(--gold-soft);color:var(--ink);border-color:var(--gold-soft);font-weight:600}
.tourbar .ex{grid-column:1/-1;font-size:13px;opacity:.7;border-top:1px solid color-mix(in srgb,var(--paper) 25%,transparent);padding-top:8px}
@media (max-width:640px){.tourbar{grid-template-columns:1fr}.tourbar .acts{justify-content:flex-start}}

/* controls */
.btn{border:1px solid var(--desk);background:var(--desk);color:var(--desk-ink);border-radius:3px;padding:9px 16px;font-weight:500;cursor:pointer}
.btn.ghost{background:transparent;color:var(--ink);border-color:var(--line)}
.btn.ghost:hover{border-color:var(--ink)}
.btn.gold{background:transparent;color:var(--ink);border-color:var(--gold)}
.btn.big{padding:12px 22px;font:600 16px/1.2 var(--display)}
.btn:disabled{opacity:.4;cursor:default}
.next .btn.big:not(:disabled){background:var(--brand);border-color:var(--brand);color:var(--brand-ink)}
.next .btn.big:not(:disabled):hover{filter:brightness(.95)}
.next .btn.big:disabled{background:var(--neutral);border-color:var(--neutral);color:var(--muted);opacity:1}
.linkbtn{background:none;border:0;padding:0;color:var(--muted);text-decoration:underline;text-underline-offset:3px;cursor:pointer;font-size:14px}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.form{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:14px 18px}
label.f{display:flex;flex-direction:column;gap:5px;font-size:14px;color:var(--muted);min-width:0}
input[type=text],select,textarea{background:var(--sheet);border:1px solid var(--line);border-radius:3px;padding:9px 11px;width:100%;color:var(--ink)}
input[type=text]:focus,select:focus,textarea:focus{border-color:var(--ink);outline:none;box-shadow:0 0 0 3px var(--gold-soft)}
textarea{min-height:120px;resize:vertical;line-height:1.6}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:3px;overflow:hidden;flex-wrap:wrap}
.seg button{background:var(--sheet);border:0;border-left:1px solid var(--line);padding:9px 16px;cursor:pointer;font-size:14px}
.seg button:first-child{border-left:0}
.seg button[aria-pressed="true"]{background:var(--desk);color:var(--desk-ink)}
.seg button:disabled:not([aria-pressed="true"]){color:var(--muted);cursor:default}
.feedback{font-size:15px;max-width:70ch}
.next{display:flex;gap:16px;align-items:center;flex-wrap:wrap;padding-top:16px;border-top:1px solid var(--line)}
details.howto{border:1px solid var(--line);border-radius:3px;background:var(--sheet);max-width:760px}
details.howto summary{cursor:pointer;padding:10px 14px;font-weight:500;list-style:none;display:flex;justify-content:space-between;gap:10px}
details.howto summary::-webkit-details-marker{display:none}
details.howto summary::after{content:"Show steps";color:var(--muted);font-weight:400;font-size:14px}
details.howto[open] summary::after{content:"Hide"}
details.howto ol{margin:0;padding:0 14px 14px 34px;display:flex;flex-direction:column;gap:5px;font-size:15px}
details.howto code,code{font:500 13px/1.4 var(--mono);background:var(--desk-soft);padding:1px 4px;border-radius:2px}
figure.embed{margin:0;border:1px solid var(--line);background:var(--sheet)}
figure.embed figcaption{display:flex;gap:4px 14px;align-items:baseline;flex-wrap:wrap;padding:9px 12px;border-bottom:1px solid var(--line);font-size:14px}
figure.embed figcaption a{margin-left:auto;color:var(--ink)}
figure.embed iframe{display:block;width:100%;height:560px;border:0;background:var(--sheet)}
.exnote{font:600 12px/1 var(--body);background:var(--warn-soft);color:var(--warn);padding:4px 6px;border-radius:2px}
.fallback{border:1px dashed var(--line);padding:14px 16px;font-size:14px;color:var(--muted);display:flex;flex-direction:column;gap:6px;max-width:760px}
@media (max-width:700px){figure.embed iframe{height:420px}}

/* ledger + tables */
.ledger{margin:0;display:grid;grid-template-columns:minmax(0,1fr) auto;max-width:540px;font-size:15px}
.ledger dt,.ledger dd{margin:0;padding:7px 0;border-bottom:1px solid var(--line)}
.ledger dt{color:var(--muted)}
.ledger dd{text-align:right;font-weight:500}
.ledger .tot{border-bottom:2px solid var(--ink);font-weight:600;color:var(--ink)}
table{border-collapse:collapse;width:100%;font-size:14px}
th,td{padding:7px 10px 7px 0;border-bottom:1px solid var(--line);text-align:left;white-space:nowrap}
th{font-weight:500;color:var(--muted);font-size:13px}
td.r,th.r{text-align:right;padding-right:0}
tr.hit td{font-weight:600}
tr.hit td:first-child::before{content:"→ ";color:var(--gold)}
.tw{overflow-x:auto}
.figs{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:0;border-top:2px solid var(--ink)}
.figs div{padding:12px 16px 12px 0;display:flex;flex-direction:column;gap:2px;min-width:0}
.figs div+div{padding-left:16px;border-left:1px solid var(--line)}
.figs b{font:700 26px/1.1 var(--display);letter-spacing:-.01em}
.figs span{font-size:13px;color:var(--muted)}
.figs em{font-style:normal;font-size:13px;font-weight:600}
@media (max-width:600px){.figs div+div{padding-left:0;border-left:0;border-top:1px solid var(--line)}}

/* brief */
.inbox{background:var(--sheet);border:1px solid var(--line);box-shadow:0 1px 0 var(--line),0 18px 40px -28px rgba(0,0,0,.35);max-width:760px}
.inbox .bar{display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap;padding:10px 18px;border-bottom:1px solid var(--line);font:500 13px/1.3 var(--body);color:var(--muted)}
.inbox .bar b{color:var(--loss);font-weight:600}
.inbox .body{padding:18px 22px 22px;display:flex;flex-direction:column;gap:12px}
.inbox .hd{font-size:14px;color:var(--muted);display:grid;grid-template-columns:70px 1fr;gap:2px 10px}
.inbox .hd b{font-weight:500;color:var(--ink)}
.inbox p{font-size:17px;line-height:1.6;max-width:62ch}
.route{list-style:none;margin:0;padding:0;display:grid;grid-template-columns:repeat(6,minmax(0,1fr));border-top:2px solid var(--ink)}
.route li{padding:10px 12px 12px 0;display:flex;flex-direction:column;gap:3px;font-size:13px;color:var(--muted);min-width:0}
.route li+li{padding-left:12px;border-left:1px solid var(--line)}
.route li b{font:700 14px/1.25 var(--display);color:var(--ink)}
.route li span.n{font:700 13px/1 var(--body);color:var(--gold)}
@media (max-width:820px){.route{grid-template-columns:repeat(3,minmax(0,1fr))}.route li:nth-child(4){padding-left:0;border-left:0}.route li:nth-child(n+4){border-top:1px solid var(--line)}}
@media (max-width:480px){.route{grid-template-columns:1fr 1fr}.route li:nth-child(odd){padding-left:0;border-left:0}.route li:nth-child(n+3){border-top:1px solid var(--line)}}
.assign td{padding:6px 18px 6px 0}
.assign tr.me td{font-weight:600}
.assign tr.me td:nth-child(2) span{background:linear-gradient(transparent 56%,var(--gold-soft) 56%);padding:0 2px}

/* reconcile */
.choice{display:grid;grid-template-columns:1fr 1fr;gap:12px;max-width:640px}
@media (max-width:560px){.choice{grid-template-columns:1fr}}
.choice button{background:var(--sheet);border:1px solid var(--line);border-radius:3px;padding:16px 18px;cursor:pointer;text-align:left;display:flex;flex-direction:column;gap:4px}
.choice button:hover:not(:disabled){border-color:var(--ink)}
.choice button b{font:700 28px/1.15 var(--display)}
.choice button.right{border-color:var(--gain);box-shadow:inset 0 0 0 1px var(--gain)}
.choice button.wrong{border-color:var(--loss);box-shadow:inset 0 0 0 1px var(--loss)}
.choice button:disabled{cursor:default}
.choice small{color:var(--muted)}

/* charts */
.chart{width:100%;overflow-x:auto}
.chart svg{display:block;width:100%;min-width:560px;height:auto}
.tip{position:fixed;pointer-events:none;z-index:40;background:var(--ink);color:var(--paper);font:500 12px/1.45 var(--body);padding:7px 9px;border-radius:3px;max-width:240px;transform:translate(-50%,calc(-100% - 12px))}
.key{display:flex;gap:6px 18px;flex-wrap:wrap;font-size:13px;color:var(--muted);align-items:center}
.key i{display:inline-block;width:20px;height:0;border-top:2px solid var(--ink);vertical-align:middle;margin-right:6px}
.key i.fc{border-top:2px dashed var(--fc)}
.key i.tg{border-top-color:var(--gold)}
.key i.bd{height:10px;border:0;background:color-mix(in srgb,var(--fc) 22%,transparent)}
.key i.wi{height:10px;border:0;background:repeating-linear-gradient(135deg,var(--muted) 0 2px,transparent 2px 5px)}
.placeholder{border:1px dashed var(--line);padding:36px 20px;text-align:center;color:var(--muted);border-radius:3px}
.months{display:grid;grid-template-columns:repeat(12,minmax(0,1fr));gap:3px}
.months div{border:1px solid var(--line);background:var(--sheet);padding:6px 4px;text-align:center;display:flex;flex-direction:column;gap:1px;min-width:0}
.months div b{font:600 12px/1.2 var(--body)}
.months div span{font-size:11px;color:var(--muted)}
.months div.meet{background:var(--gain-soft);border-color:var(--gain)}
.months div.maybe{border-style:dashed;border-color:var(--fc)}
@media (max-width:640px){.months{grid-template-columns:repeat(6,minmax(0,1fr))}}
.gap{display:grid;grid-template-columns:120px minmax(0,1fr) auto;gap:6px 12px;align-items:center;font-size:14px;max-width:760px}
.gap .tr{height:14px;background:var(--neutral);position:relative}
.gap .tr i{position:absolute;inset:0 auto 0 0;transition:width .5s ease}
@media (prefers-reduced-motion:reduce){.step{animation:none}.gap .tr i,.bar i,.pbar i{transition:none}}

/* what-if */
.assume{display:flex;gap:10px;align-items:flex-start;border:1px solid var(--line);background:var(--sheet);padding:10px 14px;font-size:14px;max-width:760px}
.assume i{flex:none;width:22px;height:14px;margin-top:3px;background:repeating-linear-gradient(135deg,var(--muted) 0 2px,transparent 2px 5px);border:1px solid var(--muted)}
.cap{display:flex;align-items:center;gap:16px;max-width:680px}
.cap input{flex:1;accent-color:var(--ink);height:28px}
.cap output{font:800 32px/1 var(--display);min-width:3.2ch;text-align:right}
.totals{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));border-top:2px solid var(--ink);max-width:900px}
.totals div{padding:10px 16px 10px 0;display:flex;flex-direction:column;gap:2px;min-width:0}
.totals div+div{padding-left:16px;border-left:1px solid var(--line)}
.totals span{font-size:13px;color:var(--muted)}
.totals b{font:700 20px/1.2 var(--display)}
.totals em{font-style:normal;font-size:13px;font-weight:600}
@media (max-width:600px){.totals{grid-template-columns:1fr}.totals div+div{padding-left:0;border-left:0;border-top:1px solid var(--line)}}
.bars{display:grid;grid-template-columns:minmax(96px,128px) minmax(0,1fr) minmax(0,1fr) 84px;gap:3px 12px;align-items:center;font-size:14px}
.bars .h{font-size:12px;color:var(--muted);padding-bottom:4px;font-weight:500}
.bars .h.r,.bars .pv{text-align:right}
.bars .lbl{border:0;background:none;text-align:left;padding:3px 0 3px 8px;cursor:pointer;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;border-left:2px solid transparent}
.bars .lbl.chg{border-left-color:var(--gold)}
.bars .lbl:hover span{text-decoration:underline;text-underline-offset:3px}
.bars .lbl[aria-pressed="true"]{font-weight:600}
.bars .lbl[aria-pressed="true"] span{background:linear-gradient(transparent 56%,var(--gold-soft) 56%);padding:0 2px}
.bar{height:16px;background:var(--neutral);position:relative}
.bar i{display:block;height:100%;transition:width .3s ease,background-color .3s}
.bar.wi i{background-image:repeating-linear-gradient(135deg,transparent 0 4px,color-mix(in srgb,var(--sheet) 55%,transparent) 4px 6px)}
.pv{font-size:13px;font-weight:600}
.scale{font-size:13px;color:var(--muted);display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.scale span.sw{display:inline-block;width:72px;height:8px;background:linear-gradient(90deg,var(--loss),var(--neutral),var(--gain))}
@media (max-width:640px){.bars{grid-template-columns:84px minmax(0,1fr) minmax(0,1fr) 64px;gap:3px 8px}}
.curves{display:grid;grid-template-columns:repeat(auto-fit,minmax(300px,1fr));gap:16px}
.curves figure{margin:0;border:1px solid var(--line);background:var(--sheet);padding:12px 12px 8px}
.curves figcaption{font-size:14px;display:flex;justify-content:space-between;gap:8px;flex-wrap:wrap}

<header class="top">
  <div class="in"><span class="t">Discount Desk</span><span class="who" id="caseLine"></span><span class="grow"></span><span class="count" id="stateChip"></span></div>
  <div class="prog"><div class="pbar" id="pbar" aria-hidden="true"></div><p class="nexttxt" id="meterBar"></p></div>
  <nav class="toc" id="rail" aria-label="Case steps"></nav>
</header>
<main class="shell" id="stage"></main>
<div class="sr" id="live" aria-live="polite"></div>
<div class="tip hidden" id="tip"></div>

<script>
/*__CORE__*/
const STAGES=["Brief","Check the data","Forecast","Set the cap","Supervise the agent","Write the memo","File the case"];

/* ---------- state ---------- */
const KEY="discount-desk-v1";
const blank=()=>({stage:0,unlocked:0,name:"",section:"",letter:"",state:"",practice:false,caseId:"",
  rec:{pick:null,entry:"",verified:false,skipped:false},
  fc:{pred:null,mase:"",typ:"",q4:""},
  wi:{cap:80,picks:[],guess:{},checked:{},q7:""},
  gd:{agent:"scripted",proposals:{},final:{},claudeErr:""},
  memo:{drill:null,text:"",review:null},
  reflect:"",
  done:{}, submittedAt:null});
let S=blank();
try{const raw=localStorage.getItem(KEY);if(raw)S=Object.assign(blank(),JSON.parse(raw));}catch(e){}
function save(){try{localStorage.setItem(KEY,JSON.stringify(S));}catch(e){}}

/* ---------- helpers ---------- */
const $=s=>document.querySelector(s);
const esc=s=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const money=(v,d=0)=>(v<0?"−$":"$")+Math.abs(v).toLocaleString("en-US",{minimumFractionDigits:d,maximumFractionDigits:d});
const kmoney=v=>Math.abs(v)<50?"$0":(v<0?"−$":"$")+(Math.abs(v)/1000).toFixed(Math.abs(v)<10000?1:0).replace(/\.0$/,"")+"K";
function niceStep(range,n){const raw=range/n,p=Math.pow(10,Math.floor(Math.log10(raw))),m=raw/p;return (m<=1?1:m<=2?2:m<=2.5?2.5:m<=5?5:10)*p;}
const signed=v=>(v>0?"+":"")+money(v);
const pct=v=>Math.round(v*100)+"%";
const monthName=i=>MONTHS[i%12]+" "+(2014+Math.floor(i/12));
const stateFor=l=>{const c=(l||"").toUpperCase().charCodeAt(0);if(!c||c<65||c>90)return "";return c<=70?"Ohio":c<=76?"Pennsylvania":c<=82?"New York":"California";};
const EMB=(typeof CTX!=="undefined")&&!!(CTX&&CTX.name);
const TOUR=(typeof CTX!=="undefined")&&!!(CTX&&CTX.tour);
const REDUCED=typeof matchMedia==="function"&&matchMedia("(prefers-reduced-motion: reduce)").matches;
/* Hosted = running on a normal web server or inside Canvas, not in the claude.ai viewer. Only hosted pages can show outside sites. */
const HOSTED=!(window.claude&&window.claude.use);
const CFG=Object.assign({tableauOverview:"",tableauOverviewTitle:"",tableauOverviewCredit:"",tableauOverviewIsExample:false,tableauSubcat:"",tableauSubcatTitle:"",tableauSubcatCredit:"",tableauSubcatIsExample:false,guardrailSheet:"",makeScenario:""},window.LAB_CONFIG||{});
function embedUrl(u){if(/public\.tableau\.com\/views\//.test(u)&&!/:embed=/.test(u))return u+(u.includes("?")?"&":"?")+":showVizHome=no&:embed=true";return u;}
function embed(url,title,credit,isExample,fallback){
  if(!HOSTED)return `<div class="fallback"><b>${esc(title)}</b><span>Outside sites can't load in this claude.ai preview. In the hosted version, the view set in <code>config.js</code> appears here.</span>${fallback?`<span>${fallback}</span>`:""}</div>`;
  if(!url)return `<div class="fallback"><b>No class ${esc(title.toLowerCase())} has been added yet.</b>${fallback?`<span>${fallback}</span>`:""}</div>`;
  const open=url.replace(/[?&]:(showVizHome|embed)=[^&]*/g,"");
  return `<details class="embedwrap"><summary>Show ${esc(title)}${isExample?" (example)":""}</summary><figure class="embed"><figcaption><b>${esc(title)}</b>${isExample?`<span class="exnote">Example, not from this course</span>`:""}${credit?`<span class="muted">${esc(credit)}</span>`:""}<a href="${esc(open)}" target="_blank" rel="noopener">Open in a new tab</a></figcaption><iframe src="${esc(embedUrl(url))}" title="${esc(title)}" loading="lazy" allowfullscreen></iframe></figure></details>`;}
if(EMB||TOUR)$(".top").classList.add("emb");
function howto(tool,steps){return `<details class="howto"><summary>In ${tool}</summary><ol>${steps.map(s=>`<li>${s}</li>`).join("")}</ol></details>`;}
function announce(t){const l=$("#live");if(l){l.textContent="";setTimeout(()=>{l.textContent=t;},30);}}
let cap={sample:null,db:null,user:null,downloads:null,tts:null};
async function use(n){try{return window.claude&&window.claude.use?await window.claude.use(n):null}catch(e){return null}}
function saveFile(name,data,type){
  if(cap.downloads)return cap.downloads.save({filename:name,data});
  const a=document.createElement("a");a.href=URL.createObjectURL(new Blob([data],{type}));a.download=name;a.click();setTimeout(()=>URL.revokeObjectURL(a.href),2000);return Promise.resolve({status:"saved"});}
const canSaveFile=()=>!!cap.downloads||HOSTED;

/* ---------- analytics: see core/case-core.js (inlined above at build) ---------- */

/* ---------- shell ---------- */
const NEED={0:"read the memo and open the case",1:"choose an export, then check your total or skip",2:"make a prediction and answer Question 4",3:"choose the two products, answer both caps and Question 7",4:"decide every request in the queue",5:"find the planted error and write at least 60 words"};
let LAST_HINT="";
let LOCKED=null;
function canOpen(i){return TOUR||i<=S.unlocked;}
function go(i){if(!canOpen(i)){LOCKED=i;render();return;}LOCKED=null;S.stage=i;save();render(true);window.scrollTo({top:0,behavior:REDUCED?"auto":"smooth"});}
function complete(i){S.done[i]=true;S.unlocked=Math.max(S.unlocked,i+1);save();}
function renderRail(){
  $("#rail").innerHTML=STAGES.map((t,i)=>{const lk=!canOpen(i);return `<button class="${S.done[i]?"done":""} ${lk?"locked":""}" ${S.stage===i?'aria-current="step"':""} ${lk?'aria-disabled="true"':""} data-go="${i}" title="${lk?"Opens after "+STAGES[i-1]:""}">${i?i+". ":""}${t}</button>`;}).join("");{const rl=$("#rail"),cur=rl.querySelector("[aria-current]");if(cur&&rl.scrollWidth>rl.clientWidth)rl.scrollLeft=Math.max(0,cur.offsetLeft-rl.offsetLeft-24);}
  $("#pbar").innerHTML=Array.from({length:6},(_,k)=>`<i class="${S.done[k+1]?"on":S.stage===k+1?"cur":""}"></i>`).join("");
  $("#meterBar").innerHTML=TOUR?`<b>Guided tour</b> · Texas class example, filled in for demonstration`:S.stage?`<b>Step ${S.stage} of 6</b> · ${esc(LAST_HINT)}`:esc(LAST_HINT);
  $("#stateChip").textContent=S.state?S.state+(S.practice?" (practice)":"")+" · target "+money(D[S.state].target)+"/mo":"";
  $("#caseLine").textContent=S.name?"· "+S.name:"";
}
function lockNote(){if(LOCKED===null)return "";const need=S.unlocked;const i=LOCKED;
  return `<div class="lock" role="status"><b>“${esc(STAGES[i])}” isn't open yet.</b><span>Steps open in order so each decision builds on real evidence. To continue, ${esc(NEED[need]||"finish the current step")} in “${esc(STAGES[need])}”.</span><div><button class="btn ghost" data-go="${need}">Go to ${esc(STAGES[need])}</button></div></div>`;}
function syncCase(){if(!S.state){S.caseId="";return;}if(TOUR){S.caseId="TX-0";return;}if(!S.done[0]||!S.caseId){const c=caseIdFor(S.name,S.state);if(c!==S.caseId){S.caseId=c;save();}}}
function render(moved){
  syncCase();
  const fn=[stBrief,stReconcile,stForecast,stWhatIf,stGuard,stMemo,stFile][S.stage];
  const lock=lockNote();const body=fn();
  $("#stage").innerHTML=`<article class="step" ${REDUCED||!moved?'style="animation:none"':""}>${TOUR?tourBar():""}${lock}${body}${TOUR?"":progFoot()}</article>`;
  renderRail();after[S.stage]&&after[S.stage]();
  if(moved){const h=$("#stage h2");if(h){h.setAttribute("tabindex","-1");h.focus({preventScroll:true});}announce("Step "+S.stage+": "+STAGES[S.stage]);}
}
const after={};
function progFoot(){return `<p class="progfoot">Saved in this browser only. <button class="linkbtn" data-prog="save">Save to a file</button> · <button class="linkbtn" data-prog="load">Restore</button> <span id="progMsg" role="status"></span></p>`;}
function restoreFrom(x){if(x&&x.schema===SCHEMA){const errs=validateExport(x);if(errs.length)throw new Error(errs.join(", "));const r=stateFromExport(x);const done=Object.keys(r.done).map(Number);const n=Object.assign(blank(),r);n.unlocked=done.length?Math.min(6,Math.max(...done)+1):0;n.stage=n.unlocked;return n;}
  throw new Error("this isn't a Discount Desk progress file");}
document.addEventListener("click",e=>{const b=e.target.closest("[data-prog]");if(!b)return;const msg=t=>{const m=$("#progMsg");if(m)m.textContent=t;};
  if(b.dataset.prog==="save"){if(!canSaveFile()){msg("Downloads aren't available in this view.");return;}const n="DiscountDesk_progress_"+(S.caseId||"new")+".json";saveFile(n,JSON.stringify(exportCase(S),null,2),"application/json").then(()=>msg("Saved "+n+".")).catch(()=>{});return;}
  const inp=document.createElement("input");inp.type="file";inp.accept=".json,application/json";inp.onchange=()=>{const f=inp.files&&inp.files[0];if(!f)return;if(f.size>500000){msg("That file is too large.");return;}
    f.text().then(t=>{const n=restoreFrom(JSON.parse(t));if(EMB&&(n.name!==S.name)){msg("That file belongs to "+n.name+", not this account.");return;}S=n;save();render(true);msg("Progress restored.");}).catch(err=>msg("Couldn't restore: "+(err&&err.message||"unreadable file")+"."));};inp.click();});
document.addEventListener("click",e=>{const g=e.target.closest("[data-go]");if(g)go(+g.dataset.go);});
function nextBtn(i,label,enabled,hint){LAST_HINT=enabled?`Ready: ${label.toLowerCase()}`:"Next: "+(hint||"finish the questions above");
  if(TOUR)return "";
  return `<div class="next"><button class="btn big" data-next="${i}" ${enabled?"":"disabled"}>${label}</button>${enabled?"":`<span class="small muted">${hint?hint.charAt(0).toUpperCase()+hint.slice(1)+".":"Finish the questions above to continue."}</span>`}</div>`;}
document.addEventListener("click",e=>{const b=e.target.closest("[data-next]");if(!b||b.disabled)return;const i=+b.dataset.next;complete(i);go(i+1);});
function head(n,title,lead,card){return `<div class="head">${n?"":`<span class="eyebrow">${S.state?`Case ${esc(S.caseId||"")} · ${esc(S.state)}`:"Discount Desk"}</span>`}<h2>${title}</h2>${lead?`<p class="lead">${lead}</p>`:""}${n?`<div class="aids">${layers(n)}${conceptLinks(n)}</div>`:""}</div>${false&&card?`<div class="casecard"><div><b>The question</b><span>${card[0]}</span></div><div><b>Why it matters</b><span>${card[1]}</span></div><div><b>Evidence</b><span>${card[2]}</span></div><div><b>Your decision</b><span>${card[3]}</span></div></div>`:""}`;}

/* ---------- readings and evidence layers ---------- */
const COMPANION=CFG.companionUrl||(HOSTED?"companion.html":"https://claude.ai/artifact/Qnv3ZwAzd8UBcHQQgM5qHA");
const READ_T={"2c":"Evaluation and Human Responsibility","4a":"Reconcile Before You Chart","4b":"Why Furniture Loses Money","4c":"Captions That Say Something","5a":"Reading a Forecast","5b":"What-If: The Discount Cap","5c":"The Assumption You Must Test","7b":"Guardrails and the Human Gate"};
const CONCEPT={1:[["4a",1]],2:[["5a",0],["5a",2]],3:[["5b",0],["5c",0]],4:[["7b",0]],5:[["5c",0],["4c",0]],6:[["2c",0]]};
const readHref=(id,sec,stage)=>COMPANION+"#r-"+id+(sec!=null?"-s"+sec:"")+(stage!=null?"-lab"+stage:"");
const readLink=(id,sec,stage)=>`<a href="${esc(readHref(id,sec,stage))}" target="_blank" rel="noopener">Reading ${id[0]}.${id.charCodeAt(1)-96}: ${esc(READ_T[id]||"")}</a>`;

  let s=`<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="Observed monthly sales 2014 to 2017, a 2018 forecast with its likely range, and the ${money(fc.target)} target. ${fc.meet} of 12 forecast months reach the target.">`;

  for(let yr=0;yr<5;yr++){const i=yr*12;s+=`<text x="${X(i)}" y="${H-8}" font-size="11" fill="var(--muted)" font-family="IBM Plex Sans">${2014+yr}</text>`;}
  const band=fc.f.map(p=>`${X(p.i)},${Y(p.hi)}`).join(" ")+" "+fc.f.slice().reverse().map(p=>`${X(p.i)},${Y(p.lo)}`).join(" ");
  s+=`<polygon points="${band}" fill="var(--fc)" opacity=".18"/>`;

  s+=`<polyline fill="none" stroke="var(--fc)" stroke-width="2.2" stroke-dasharray="6 4" points="${X(y.length-1)},${Y(y[y.length-1])} ${fc.f.map(p=>X(p.i)+","+Y(p.v)).join(" ")}"/>`;
  s+=`<line x1="${pl}" x2="${W-pr}" y1="${Y(fc.target)}" y2="${Y(fc.target)}" stroke="var(--gold)" stroke-width="2"/><rect x="${pl+4}" y="${Y(fc.target)-19}" width="118" height="16" fill="var(--sheet)" opacity=".85"/><text x="${pl+8}" y="${Y(fc.target)-7}" font-size="11" font-weight="600" fill="var(--gold)" font-family="IBM Plex Sans">Target ${money(fc.target)}/mo</text>`;
  fc.f.forEach(p=>{const m=p.v>=fc.target;s+=`<circle cx="${X(p.i)}" cy="${Y(p.v)}" r="3.5" fill="${m?"var(--gain)":"var(--sheet)"}" stroke="${m?"var(--gain)":"var(--fc)"}" stroke-width="1.5"/>`;});
  s+=`<line id="guide" x1="0" x2="0" y1="${pt-18}" y2="${H-pb}" stroke="var(--ink)" stroke-width="1" opacity="0"/>`;

  const dl=$("#dlBtn");if(dl)dl.onclick=()=>{const name=caseName();saveFile(name,caseHTML(),"text/html").then(r=>{$("#fileMsg").textContent=(r&&r.status==="delivered")?"Sent.":"Saved as "+name+". Now upload it to the Canvas assignment.";announce("Case file saved");}).catch(e=>{if(e&&e.code!=="declined")$("#fileMsg").textContent="Download isn't available here. Copy your verification code instead.";});};
  const jb=$("#jsonBtn");if(jb)jb.onclick=()=>{const n=caseName().replace(/\.html$/,".json");saveFile(n,JSON.stringify(exportCase(S),null,2),"application/json").then(()=>{$("#fileMsg").textContent="Saved "+n+".";}).catch(()=>{});};
  const cb=$("#copyBtn");if(cb)cb.onclick=()=>{const c=summary().code;navigator.clipboard.writeText(c).then(()=>{$("#fileMsg").textContent="Copied "+c;}).catch(()=>{$("#fileMsg").textContent="Your code is "+c;});};
  const rs=$("#resetBtn");let armed=false;if(rs)rs.onclick=()=>{if(!armed){armed=true;rs.textContent="Click again to erase your answers";return;}S=blank();save();render(true);};
  instructorPanel();
};
let unsubInst=null;
async function instructorPanel(){const host=$("#instructor");if(!host||!cap.db||!cap.user)return;let canEdit=false;try{canEdit=await cap.user.canEdit();}catch(e){}
  if(!canEdit)return;host.innerHTML='<div class="part wide"><h3>Filed cases</h3><p class="small muted">Loading…</p></div>';
  if(unsubInst)unsubInst();const timer=setTimeout(()=>{const p=host.querySelector("p");if(p)p.textContent="Filed cases can't be reached yet.";},10000);
  unsubInst=cap.db.collection("submissions").orderBy("filedAt","desc").onSnapshot(snap=>{clearTimeout(timer);const rows=snap.docs.map(d=>d.data());
    host.innerHTML=`<div class="part wide"><h3>Filed cases (${rows.length}) <span class="tag">claude.ai preview only</span></h3>${rows.length?`<div class="tw"><table><tr><th>Name</th><th>Section</th><th>State</th><th>Code</th><th>Control</th><th>Caps</th><th>Requests</th><th>Caught</th><th>Memo</th><th>Filed</th></tr>${rows.map(r=>`<tr><td>${esc(r.name)}</td><td>${esc(r.section)}</td><td>${esc(r.state)}</td><td>${esc(r.code)}</td><td>${r.controlTotal?"✓":"No"}</td><td>${esc(r.capsRight)}/2</td><td>${esc(r.guardrail)}</td><td>${esc(r.caught)}</td><td>${esc(r.traced)} / ${esc(r.untraced)}</td><td>${esc(new Date(r.filedAt).toLocaleDateString())}</td></tr>`).join("")}</table></div>`:'<p class="small muted">None yet.</p>'}</div>`;},
    ()=>{clearTimeout(timer);host.innerHTML='<div class="part wide"><h3>Filed cases</h3><p class="small muted">Not available in this view.</p></div>';});}

/* ---------- boot ---------- */
if(TOUR){S=demoState();S.stage=TOUR_STOPS[0].s;}
else if(!EMB){const m=/^#step-([0-6])$/.exec(location.hash||"");if(m){if(+m[1]<=S.unlocked)S.stage=+m[1];else LOCKED=+m[1];}}
if(!TOUR&&typeof CTX!=="undefined"&&CTX&&CTX.step!=null){if(CTX.step<=S.unlocked)S.stage=CTX.step;else LOCKED=CTX.step;}
render();
(async()=>{const [sm,db,us,dl,tt]=await Promise.all(["sample","db","user","downloads","tts"].map(use));cap={sample:sm,db,user:us,downloads:dl,tts:tt};render();})();
