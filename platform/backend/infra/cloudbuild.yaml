# Cloud Build: test, build both images, push, deploy to Cloud Run.
# Run from platform/backend:
#   gcloud builds submit --config infra/cloudbuild.yaml .
# The Cloud Run services, service accounts and env vars come from infra/terraform.
# This file only rolls out new images to the existing services.
substitutions:
  _REGION: us-central1
  _PREFIX: cai3801
  _TAG: manual

steps:
  - id: install
    name: node:24
    entrypoint: npm
    args: ["ci"]

  - id: test
    name: node:24
    entrypoint: npm
    args: ["test"]

  - id: build-api
    name: gcr.io/cloud-builders/docker
    args: ["build", "-f", "infra/docker/api.Dockerfile",
           "-t", "${_REGION}-docker.pkg.dev/$PROJECT_ID/${_PREFIX}-images/api:${_TAG}", "."]
    waitFor: ["test"]

  - id: build-mcp
    name: gcr.io/cloud-builders/docker
    args: ["build", "-f", "infra/docker/mcp.Dockerfile",
           "-t", "${_REGION}-docker.pkg.dev/$PROJECT_ID/${_PREFIX}-images/mcp:${_TAG}", "."]
    waitFor: ["test"]

  - id: push-api
    name: gcr.io/cloud-builders/docker
    args: ["push", "${_REGION}-docker.pkg.dev/$PROJECT_ID/${_PREFIX}-images/api:${_TAG}"]
    waitFor: ["build-api"]

  - id: push-mcp
    name: gcr.io/cloud-builders/docker
    args: ["push", "${_REGION}-docker.pkg.dev/$PROJECT_ID/${_PREFIX}-images/mcp:${_TAG}"]
    waitFor: ["build-mcp"]

  - id: deploy-api
    name: gcr.io/google.com/cloudsdktool/cloud-sdk:slim
    entrypoint: gcloud
    args: ["run", "deploy", "${_PREFIX}-api", "--region", "${_REGION}",
           "--image", "${_REGION}-docker.pkg.dev/$PROJECT_ID/${_PREFIX}-images/api:${_TAG}"]
    waitFor: ["push-api"]

  - id: deploy-mcp
    name: gcr.io/google.com/cloudsdktool/cloud-sdk:slim
    entrypoint: gcloud
    args: ["run", "deploy", "${_PREFIX}-mcp", "--region", "${_REGION}",
           "--image", "${_REGION}-docker.pkg.dev/$PROJECT_ID/${_PREFIX}-images/mcp:${_TAG}"]
    waitFor: ["push-mcp"]

images:
  - "${_REGION}-docker.pkg.dev/$PROJECT_ID/${_PREFIX}-images/api:${_TAG}"
  - "${_REGION}-docker.pkg.dev/$PROJECT_ID/${_PREFIX}-images/mcp:${_TAG}"

options:
  logging: CLOUD_LOGGING_ONLY
